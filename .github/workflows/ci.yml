name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Load the packed packages with import and require
        run: |
          # Unpacked inside the checkout, so their dependencies resolve from the root node_modules.
          smoke="$PWD/.pack-smoke"
          for pkg in sdk cdk agent cli; do
            mkdir -p "$smoke/node_modules/sunaba-$pkg"
            npm pack -w "packages/$pkg" --ignore-scripts --pack-destination "$smoke"
            tar -xzf "$smoke"/sunaba-"$pkg"-*.tgz -C "$smoke/node_modules/sunaba-$pkg" --strip-components=1
          done
          cd "$smoke"
          for spec in sunaba-sdk sunaba-sdk/guest sunaba-cdk sunaba-agent sunaba-cli; do
            node --input-type=module -e "await import('$spec')"
            node -e "require('$spec')"
          done
          node node_modules/sunaba-cli/dist/main.js --version
          node node_modules/sunaba-agent/dist/agentd.js --help
      - run: npm run typecheck
      - run: npm test
      - run: npx biome check .
